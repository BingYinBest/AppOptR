name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cd AppOpt && cargo test && cargo build --release
      - run: cd AppOpt && cargo clippy --all-targets -- -D warnings

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install bpf-linker
        run: |
          curl -sL -o /tmp/bpf.tar.zst https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar --zstd -xf /tmp/bpf.tar.zst -C /usr/local/bin
      - name: Install NDK clang
        run: |
          sudo apt-get update && sudo apt-get install -y zstd unzip
      - name: Cross compile
        env:
          NDK: /usr/local/lib/android/sdk/ndk
        run: |
          NDK_BIN=$(ls -d $NDK/*/toolchains/llvm/prebuilt/linux-x86_64/bin | head -1)
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android24-clang \
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$NDK_BIN/x86_64-linux-android24-clang \
          CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=$NDK_BIN/llvm-ar \
          CARGO_TARGET_X86_64_LINUX_ANDROID_AR=$NDK_BIN/llvm-ar \
          CARGO_TARGET_BPFEL_UNKNOWN_NONE_LINKER=bpf-linker \
          bash -euc '
            cd AppOpt && cargo build --release --target aarch64-linux-android && cargo build --release --target x86_64-linux-android
            cd ../AppOpt-ebpf && cargo +nightly build --release --target bpfel-unknown-none -Z build-std=core
          '
      - name: Package module
        run: bash scripts/package.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appopt-module
          path: modules_update/线程优化v*.zip