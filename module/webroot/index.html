<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0A0C10">
<title>正在打开 AppOpt</title>
<style>
html,body{height:100%;margin:0}
body{background:#0A0C10;color:#EDF1F7;font-family:-apple-system,"PingFang SC",system-ui,sans-serif;
display:grid;place-items:center;background-image:radial-gradient(60% 40% at 50% 0,rgba(255,176,32,.14),transparent 70%)}
.box{text-align:center;padding:24px}
.mark{width:56px;height:56px;margin:0 auto 16px;border-radius:14px;border:1px solid rgba(255,255,255,.14);
display:grid;place-items:center;background:linear-gradient(150deg,#2B2113,#171B24)}
.mark svg{width:28px;height:28px;stroke:#FFB020;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:17px;font-weight:650;letter-spacing:.04em;margin:0 0 6px}
p{font-size:12.5px;color:#8B93A1;margin:0 0 18px;font-family:ui-monospace,Menlo,monospace}
a{color:#FFB020;font-size:13px;text-decoration:none;border:1px solid rgba(255,176,32,.4);
border-radius:999px;padding:8px 18px;display:inline-block}
</style>
</head>
<body>
<div class="box">
<div class="mark"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></svg></div>
<h1>AppOpt 管理面板</h1>
<p id="addr">正在读取面板端口…</p>
<a id="open" href="http://127.0.0.1:8889">立即打开</a>
</div>
<script>
(function(){
  var port=8889;
  fetch('port.js?t='+Date.now(),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('no port');return r.text()})
    .then(function(t){var m=t.match(/APPOPT_PORT\s*=\s*(\d+)/);if(m)port=+m[1]})
    .catch(function(){})
    .finally(function(){
      var url='http://127.0.0.1:'+port+'/';
      document.getElementById('addr').textContent='127.0.0.1:'+port;
      document.getElementById('open').href=url;
      setTimeout(function(){location.replace(url)},600);
    });
})();
</script>
</body>
</html>
